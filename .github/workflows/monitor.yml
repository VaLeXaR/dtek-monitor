name: Run power outages monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [check-dtek]

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout artifacts
        shell: bash
        run: |
          remote_branch=$(git ls-remote --heads origin artifacts)

          if [ -n "$remote_branch" ]; then
            git fetch --depth 1 origin artifacts
            git worktree add --detach artifacts FETCH_HEAD
          else
            git worktree add --orphan -b artifacts artifacts

            for file in \
              last-message.json \
              emergency-outages-message.json \
              emergency-outages.json
            do
              source_commit=$(git log --diff-filter=AM --format=%H -1 -- "artifacts/$file")
              if [ -n "$source_commit" ]; then
                git show "$source_commit:artifacts/$file" > "artifacts/$file"
              fi
            done
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run monitoring script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
          RETRY_MAX_ATTEMPTS: ${{ vars.RETRY_MAX_ATTEMPTS }}
          RETRY_DELAY_MS: ${{ vars.RETRY_DELAY_MS }}
          QUIET_HOURS_START: ${{ vars.QUIET_HOURS_START }}
          QUIET_HOURS_END: ${{ vars.QUIET_HOURS_END }}
        run: node ./src/monitor.js

      - name: Commit updated artifacts
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git -C artifacts add --all

          if git -C artifacts diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          if git -C artifacts rev-parse --verify --quiet HEAD; then
            git -C artifacts commit --amend --no-edit
          else
            git -C artifacts commit -m "chore: update artifacts"
          fi

          expected_sha=$(git ls-remote --heads origin artifacts | cut -f1)
          git push \
            --force-with-lease="refs/heads/artifacts:$expected_sha" \
            origin \
            "$(git -C artifacts rev-parse HEAD):refs/heads/artifacts"

      - name: Keep workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/$GITHUB_REPOSITORY/actions/workflows/monitor.yml/enable"
