name: dtek-monitor

services:
  monitor:
    build: .
    container_name: dtek-monitor
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Kyiv
    shm_size: 1gb
    volumes:
      - monitor-state:/app/artifacts

volumes:
  monitor-state:
    name: dtek-monitor_monitor-state
